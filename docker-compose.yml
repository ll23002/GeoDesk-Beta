services:
  # Redis/Celery
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (FastAPI / Uvicorn)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - HYP3_USERNAME=${HYP3_USERNAME}
      - HYP3_PASSWORD=${HYP3_PASSWORD}
      - ERA5_KEY=${ERA5_KEY}
    volumes:
      # job_status
      - geodesk_jobs:/app/job_status
      # mintpy_results
      - geodesk_results:/app/mintpy_results
      # alaska_descargas
      - geodesk_downloads:/app/alaska_descargas
      # Sesiones ad-hoc
      - geodesk_adhoc:/tmp/geodesk_adhoc_sessions
    cpuset: "5,6,7"
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: >
      celery
      --app=celery_app.celery_app
      worker
      -B
      --queues=geodesk_heavy
      --concurrency=5
      --loglevel=INFO
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - HYP3_USERNAME=${HYP3_USERNAME}
      - HYP3_PASSWORD=${HYP3_PASSWORD}
      - ERA5_KEY=${ERA5_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - geodesk_jobs:/app/job_status
      - geodesk_results:/app/mintpy_results
      - geodesk_downloads:/app/alaska_descargas
      - geodesk_adhoc:/tmp/geodesk_adhoc_sessions
    cpuset: "0,1,2,3,4"
    mem_limit: 12g
    memswap_limit: 12g
    depends_on:
      redis:
        condition: service_healthy

  # Frontend (Nginx + React/Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/geo-desk
    restart: always
    environment:
      - BACKEND_UPSTREAM=backend:8000
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  redis_data:
  geodesk_jobs:
  geodesk_results:
  geodesk_downloads:
  geodesk_adhoc: